[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "januaryai-server"
version = "0.0.0"
description = "Typed January server SDK generated from the partner API contract"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3", "typing-extensions>=4.12,<5"]

[project.urls]
Documentation = "https://partners.january.ai/v1.2/docs#/"

[project.optional-dependencies]
test = ["pytest>=8.0", "pyright>=1.1.400", "build>=1.2", "python-dotenv>=1.0", "fastapi>=0.115,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/januaryai"]

# Explicit exclusions also apply without a Git repository or ignore-file support.
[tool.hatch.build]
exclude = ["/.env", "/.env.*", "/.e2e-results/**", "/.venv/**", "/dist/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests/typecheck.py", "examples/quickstart"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportUnnecessaryIsInstance = false
