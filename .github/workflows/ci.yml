name: Python SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: pyright
      - run: python -m build
      - name: Install wheel and exercise loopback HTTP service
        run: |
          python -m venv /tmp/january-wheel-consumer
          /tmp/january-wheel-consumer/bin/python -m pip install dist/*.whl
          /tmp/january-wheel-consumer/bin/python -I tests/installed_consumer.py
